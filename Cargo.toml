[package]
name = "openscad_rs"
version = "0.1.0"
edition = "2021"
description = "Cross-platform Rust port of OpenSCAD core (Manifold backend, no CGAL)"
license = "GPL-2.0-or-later"
rust-version = "1.75"

[dependencies]
manifold-rust = "0.13"
anyhow = "1.0"
eframe = { version = "0.29", optional = true }
egui = { version = "0.29", optional = true }
rfd = { version = "0.15", optional = true }

[features]
default = ["gui"]
gui = ["eframe", "egui", "rfd"]

[[bin]]
name = "openscad_rs"
path = "src/main.rs"

[[bin]]
name = "openscad_rs_gui"
path = "src/bin/gui.rs"
required-features = ["gui"]

[profile.release]
lto = true
codegen-units = 1
